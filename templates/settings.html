{% extends "base.html" %}
{% set page = "settings" %}
{% set title = "Settings" %}
{% block content %}
<section id="admin-limit-panel" class="card settings-form" style="display:none">
<h2>Alert settings</h2>
<fieldset><legend>Temperature</legend><div class="field-pair">
<label>Warning <span data-temperature-unit>°C</span><input id="tempLimit" type="number" step="0.1"></label>
<label>Critical <span data-temperature-unit>°C</span><input id="tempCriticalLimit" type="number" step="0.1"></label>
</div></fieldset>
<fieldset><legend>pH · Warning range</legend><div class="field-pair">
<label>Lower<input id="phLowLimit" type="number" min="0" max="14" step="0.1"></label>
<label>Upper<input id="phHighLimit" type="number" min="0" max="14" step="0.1"></label>
</div></fieldset>
<fieldset><legend>pH · Critical limits</legend><div class="field-pair">
<label>Lower<input id="phCriticalLowLimit" type="number" min="0" max="14" step="0.1"></label>
<label>Upper<input id="phCriticalHighLimit" type="number" min="0" max="14" step="0.1"></label>
</div><p class="control-note">Critical at or beyond either limit.</p></fieldset>
<details><summary>Advanced settings</summary><div class="field-pair">
<label>Website viewers<input id="maxWebsiteViewers" type="number" min="1" step="1"></label>
<label>Camera viewers<input id="maxCameraViewers" type="number" min="1" step="1"></label>
<label>Trend observation (sec)<input id="predictionDelaySeconds" type="number" min="1" step="1"></label>
<label>Prediction duration (sec)<input id="predictionAlertDurationSeconds" type="number" min="1" step="1"></label>
</div></details>
<button id="save-limits" class="mode-btn" type="button">Save settings</button>
<p id="mode-message" role="status" aria-live="polite"></p>
</section>
{% endblock %}
