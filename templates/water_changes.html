{% extends "base.html" %}
{% set page = "water" %}
{% set title = "Water Changes" %}
{% block content %}
<section id="admin-control-panel" class="card" style="display:none"><h2>Drain and refill</h2><p id="water-control-status" role="status"></p><div id="manual-override-panel" class="manual-override-panel" >
                <div class="manual-control-grid">
                    <button type="button" class="pump-btn extract" onclick="sendWaterAction('extract_start')"><i class="fas fa-arrow-up-from-water-pump"></i> Drain water</button>
                    <button type="button" class="pump-btn muted" onclick="sendWaterAction('extract_stop')">Stop draining</button>
                    <button type="button" class="pump-btn insert" onclick="sendWaterAction('insert_start')"><i class="fas fa-faucet-drip"></i> Refill water</button>
                    <button type="button" class="pump-btn muted" onclick="sendWaterAction('insert_stop')">Stop refilling</button>
                    <button type="button" class="pump-btn insert" onclick="sendWaterAction('both_start')"><i class="fas fa-water"></i> Both pumps — drain + refill</button>
                    <button type="button" class="pump-btn danger" onclick="sendWaterAction('stop_all')"><i class="fas fa-stop"></i> Stop All Pumps</button>
                    <button type="button" class="pump-btn auto" onclick="sendWaterAction('auto_resume')"><i class="fas fa-rotate"></i> Resume automatic control</button>

                </div>

                <p class="control-note">Manual pumps stay on until stopped. Resume Auto to restore automation.</p>
            </div></section>
{% include "water_schedule.html" %}
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='water_schedule.js') }}?v=31"></script>{% endblock %}
